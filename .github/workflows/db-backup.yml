name: Database backup (weekly)

on:
  schedule:
    - cron: "30 2 * * 0" # Sundays
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "TURSO_DATABASE_URL / BACKUP_PASSPHRASE secrets missing — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.cfg.outputs.skip != 'true'
      - name: Export user data
        if: steps.cfg.outputs.skip != 'true'
        run: npm run db:backup
      # The repository is public, so the artifact is encrypted. Decrypt with:
      # openssl enc -d -aes-256-cbc -pbkdf2 -in backup.json.enc -out backup.json -pass pass:<BACKUP_PASSPHRASE>
      - name: Encrypt
        if: steps.cfg.outputs.skip != 'true'
        run: |
          for f in backups/*.json; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$f.enc" -pass env:BACKUP_PASSPHRASE
            rm "$f"
          done
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          name: studscollector-backup-${{ github.run_number }}
          path: backups/*.enc
          retention-days: 90
